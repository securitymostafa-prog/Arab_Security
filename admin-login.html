<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة | ArabSecurity Admin Gate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

    <div class="site-dynamic-bg"></div>

    <div class="login-card">
        <div class="login-lock-icon">
            <i class="fas fa-user-lock"></i>
        </div>

        <h1 class="login-title">بوابة الإدارة السرية</h1>
        <p class="login-subtitle">منطقة محمية لمشرفي ومطوري منصة ArabSecurity</p>

        <div class="login-alert" id="loginAlert">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="loginAlertText">اسم المستخدم أو كلمة المرور غير صحيحة!</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <div class="input-with-icon">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="loginUsername" class="form-control" required placeholder="أدخل اسم المستخدم" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <div class="input-with-icon">
                    <i class="fas fa-key"></i>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; margin-top:10px; font-size:1.05rem;">
                <i class="fas fa-arrow-right-to-bracket"></i> تسجيل الدخول للوحة التحكم
            </button>
        </form>

        <div style="margin-top:24px; padding-top:18px; border-top:1px solid rgba(255, 255, 255, 0.08);">
            <a href="index.html" style="color:var(--text-secondary); text-decoration:none; font-size:0.88rem; display:inline-flex; align-items:center; gap:8px;">
                <i class="fas fa-arrow-right"></i> العودة إلى الموقع الرئيسي
            </a>
        </div>
    </div>

    <script src="js/admin-config.js"></script>
    <script src="js/default-data.js"></script>
    <script src="js/site-data.js"></script>
    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');

            // التحقق من صحة الدخول (يعمل بكلمة مرور الكود وبكلمة مرور الموقع معاً!)
            if (validateAdminCredentials(userInput, passInput)) {
                // حفظ حالة الدخول
                sessionStorage.setItem('arabsec_admin_authenticated', 'true');
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(34, 197, 94, 0.15)';
                alertBox.style.borderColor = 'rgba(34, 197, 94, 0.4)';
                alertBox.style.color = '#86efac';
                alertText.textContent = 'تم التحقق بنجاح! جاري توجيهك إلى لوحة التحكم...';
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);
            } else {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
                alertBox.style.borderColor = 'rgba(239, 68, 68, 0.35)';
                alertBox.style.color = '#fca5a5';
                alertText.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
            }
        }
    </script>
</body>
</html>
